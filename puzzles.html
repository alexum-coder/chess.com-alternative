<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess puzzles · Zugzwang</title><link rel="stylesheet" href="/theme.css"><style>
body{margin:0;background:#f1f3ef;color:#29352a;font:16px system-ui}header{padding:14px 5vw;background:#fff;border-bottom:1px solid #dce4db;display:flex;gap:20px;align-items:center}header a{color:inherit;text-decoration:none;font-weight:700}header strong{margin-right:auto;color:#5b8e3d;font-size:1.2rem}main{max-width:1000px;margin:26px auto;padding:0 16px;display:grid;grid-template-columns:minmax(280px,620px) minmax(240px,1fr);gap:20px}.panel{background:#fff;border:1px solid #e0e7de;border-radius:12px;padding:18px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:8px;overflow:hidden}.sq{border:0;border-radius:0;padding:0;aspect-ratio:1;font-size:clamp(24px,6vw,56px);line-height:1}.l{background:#eeeed2}.d{background:#769656}.sq.sel{box-shadow:inset 0 0 0 4px #f6d64a}.sq.target{background-image:radial-gradient(#283b2780 20%,transparent 22%)}button{padding:9px 14px;border:1px solid #dce4db;border-radius:8px;background:#f5f8f3;color:#29352a;cursor:pointer}.primary{background:#81b64c;font-weight:700}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.status{min-height:1.6em;color:#596957}.muted{color:#6d786c;font-size:.88rem}.stat{font-size:1.5rem;font-weight:800}@media(max-width:760px){main{grid-template-columns:1fr;margin:12px auto}}
</style></head><body><header><strong>Zugzwang</strong><a href="/">Play online</a><a href="/computer.html">Play computer</a><a href="/puzzles.html">Puzzles</a></header><main><section class="panel"><h2>Daily tactics</h2><div class="row"><label>Rating range <select id="range"><option value="0,1200">Beginner</option><option value="1200,1600" selected>Intermediate</option><option value="1600,2000">Advanced</option><option value="2000,3500">Expert</option></select></label><button id="next" class="primary">New puzzle</button></div><div id="board" class="board"></div><p id="status" class="status">Loading a puzzle…</p><div class="row"><button id="hint">Hint</button><button id="solution">Show solution</button></div></section><aside class="panel"><h2 id="title">Solve the position</h2><p class="stat" id="rating">—</p><p class="muted" id="themes"></p><p class="muted">Find the best continuation. The first move is played for you; enter the solution moves on the board. Puzzles are sourced from the Lichess CC0 database.</p><p id="feedback" class="status"></p></aside></main>
<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';
const $=id=>document.getElementById(id), glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};
let puzzle=null,chess=null,solution=[],step=0,selected=null,targets=[];
async function load(){ $('status').textContent='Finding a puzzle…';$('feedback').textContent='';selected=null;const [min,max]=$('range').value.split(',');try{const r=await fetch(`/api/puzzles/random?min=${min}&max=${max}`);const data=await r.json();if(!r.ok)throw Error(data.error||'Puzzle service unavailable');puzzle=data;chess=new Chess(data.fen);solution=data.moves.trim().split(/\s+/);step=0;const first=uciMove(solution[0]);chess.move(first);step=1;$('rating').textContent=`${data.rating} rated`;$('themes').textContent=(data.themes||[]).join(' · ');$('title').textContent='Find the best move';$('status').textContent=(chess.turn()==='w'?'White':'Black')+' to play';render();}catch(e){$('status').textContent=e.message;}}
function uciMove(u){return {from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'};}
function render(){const b=$('board');b.replaceChildren();const white=chess.turn()==='w';for(let ri=0;ri<8;ri++)for(let fi=0;fi<8;fi++){const f=white?fi:7-fi,r=white?7-ri:ri,sq='abcdefgh'[f]+(r+1),p=chess.get(sq),el=document.createElement('button');el.className='sq '+((r+f)%2?'d':'l')+(selected===sq?' sel':'')+(targets.includes(sq)?' target':'');el.textContent=p?glyph[p.color+p.type]:'';el.onclick=()=>click(sq);b.append(el);}}
function click(sq){if(!chess||step>=solution.length)return;const p=chess.get(sq);if(selected){const from=selected;try{const m=chess.move({from,to:sq,promotion:'q'});if(m){const u=m.from+m.to+(m.promotion||'');const expected=solution[step];if(u!==expected){chess.undo();$('feedback').textContent='Not quite — try another move.';selected=null;targets=[];render();return;}step++;selected=null;targets=[];$('feedback').textContent='Nice!';if(step<solution.length){const reply=uciMove(solution[step]);chess.move(reply);step++;}if(step>=solution.length){$('status').textContent='Puzzle solved — clean tactics!';$('feedback').textContent='Solved. '+(puzzle.themes||[]).join(', ');}else $('status').textContent='Your move';render();return;}}catch{} }
selected=p&&p.color===chess.turn()?sq:null;targets=selected?chess.moves({square:selected,verbose:true}).map(m=>m.to):[];render();}
$('next').onclick=load;$('hint').onclick=()=>{$('feedback').textContent=solution[step]?'Look for a move starting from '+solution[step].slice(0,2)+'.':'No hint available.'};$('solution').onclick=()=>{$('feedback').textContent=solution.slice(step).join(' ');};load();
</script></body></html>
