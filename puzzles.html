<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chess puzzles · Zugzwang</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/board.css">
  <style>
    main { max-width: 1120px; margin: 24px auto; padding: 0 18px 48px; display:grid; grid-template-columns:minmax(280px,650px) minmax(250px,1fr); gap:20px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:18px; box-shadow:0 2px 9px rgba(35,49,39,.045); }
    .panel h2 { margin:0 0 12px; font-size:1.04rem; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    button, select { padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--ink); font:inherit; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#172014; font-weight:800; }
    button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .status { min-height:1.6em; color:var(--muted); }
    .muted { color:var(--muted); font-size:.9rem; }
    .stat { font-size:1.6rem; font-weight:800; }
    @media(max-width:780px){ main { grid-template-columns:1fr; margin:14px auto; padding:0 12px 36px; gap:12px; } .panel { padding:14px; } }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h2>Daily tactics</h2>
      <div class="row">
        <label for="range">Rating range</label>
        <select id="range">
          <option value="0,1200">Beginner</option>
          <option value="1200,1600" selected>Intermediate</option>
          <option value="1600,2000">Advanced</option>
          <option value="2000,3500">Expert</option>
        </select>
        <button id="next" class="primary">New puzzle</button>
      </div>
      <div id="board" class="zz-board" aria-label="Chess board"></div>
      <p id="status" class="status" role="status" aria-live="polite">Loading a puzzle…</p>
      <div class="row"><button id="hint">Hint</button><button id="solution">Show solution</button></div>
    </section>
    <aside class="panel">
      <h2 id="title">Solve the position</h2>
      <p class="stat" id="rating">—</p>
      <p class="muted" id="themes"></p>
      <p class="muted">Find the best continuation. The first move is played for you; enter the solution moves on the board. Puzzles are sourced from the Lichess CC0 database.</p>
      <p id="feedback" class="status" aria-live="polite"></p>
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="/nav.js"></script>
  <script type="module">
    import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';
    import { ZugzwangBoard } from '/board.js';
    const $ = (id) => document.getElementById(id);
    let puzzle = null, chess = null, solution = [], step = 0, selected = null, targets = [], lastMove = [];
    const board = new ZugzwangBoard($('board'), click);

    async function load() {
      $('status').textContent = 'Finding a puzzle…';
      $('feedback').textContent = '';
      selected = null; targets = []; lastMove = [];
      const [min, max] = $('range').value.split(',');
      try {
        const response = await fetch(`/api/puzzles/random?min=${min}&max=${max}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Puzzle service unavailable');
        puzzle = data;
        chess = new Chess(data.fen);
        solution = String(data.moves || '').trim().split(/\s+/).filter(Boolean);
        if (!solution.length) throw new Error('This puzzle has no solution line. Try another puzzle.');
        const first = uciMove(solution[0]);
        const played = chess.move(first);
        if (!played) throw new Error('Puzzle data contains an invalid opening move. Try another puzzle.');
        lastMove = [played.from, played.to];
        step = 1;
        $('rating').textContent = `${data.rating} rated`;
        $('themes').textContent = (data.themes || []).join(' · ');
        $('title').textContent = 'Find the best move';
        $('status').textContent = `${chess.turn() === 'w' ? 'White' : 'Black'} to play`;
        render();
      } catch (error) {
        chess = null;
        board.render({ position: new Chess().board(), interactive: false });
        $('status').textContent = error.message;
      }
    }

    function uciMove(uci) {
      return { from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || 'q' };
    }
    function render() {
      if (!chess) return;
      board.render({
        position: chess.board(),
        orientation: chess.turn() === 'w' ? 'white' : 'black',
        selected, targets, lastMove, inCheck: chess.isCheck(), turn: chess.turn()
      });
    }
    function click(square) {
      if (!chess || step >= solution.length) return;
      const piece = chess.get(square);
      if (selected && targets.includes(square)) {
        try {
          const move = chess.move({ from: selected, to: square, promotion: 'q' });
          if (move) {
            const uci = move.from + move.to + (move.promotion || '');
            if (uci !== solution[step]) {
              chess.undo();
              $('feedback').textContent = 'Not quite — try another move.';
              selected = null; targets = []; render(); return;
            }
            lastMove = [move.from, move.to];
            step++; selected = null; targets = [];
            $('feedback').textContent = 'Nice move — keep it going.';
            if (step < solution.length) {
              const reply = chess.move(uciMove(solution[step]));
              if (!reply) { $('status').textContent = 'Puzzle line error. Please load another puzzle.'; render(); return; }
              lastMove = [reply.from, reply.to];
              step++;
            }
            if (step >= solution.length) {
              $('status').textContent = 'Puzzle solved — clean tactics!';
              $('feedback').textContent = 'Solved. ' + (puzzle.themes || []).join(', ');
            } else $('status').textContent = 'Your move';
            render(); return;
          }
        } catch { /* An illegal destination falls through to selection handling. */ }
      }
      selected = piece && piece.color === chess.turn() ? square : null;
      targets = selected ? chess.moves({ square: selected, verbose: true }).map((move) => move.to) : [];
      render();
    }
    $('next').addEventListener('click', load);
    $('hint').addEventListener('click', () => {
      $('feedback').textContent = solution[step] ? 'Look for a move starting from ' + solution[step].slice(0, 2) + '.' : 'No hint available.';
    });
    $('solution').addEventListener('click', () => { $('feedback').textContent = solution.slice(step).join(' '); });
    load();
  </script>
</body>
</html>
